name: Pygame Web Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pygbag
        run: pip install pygbag

      - name: Build web game
        run: pygbag main.py --build

      - name: Upload web files
        uses: actions/upload-artifact@v4
        with:
          name: web-game
          path: build/web/
