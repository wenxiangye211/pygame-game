name: Build APK with Buildozer
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-dev build-essential libssl-dev libffi-dev python3-setuptools python3-wheel openjdk-17-jdk unzip git

      - name: Install buildozer
        run: pip install buildozer

      - name: Initialize buildozer spec
        run: buildozer init

      - name: Build APK
        run: buildozer android debug deploy run || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: bin/*.apk
